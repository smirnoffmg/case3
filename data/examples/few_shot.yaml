safe:
  # Aggregate — no LIMIT required (auditor exempts AggFuncs from NO_PAGINATION).
  - task: "Сколько всего сотрудников"
    sql: "SELECT COUNT(*) FROM public.sys_employee;"
  # MIN/MAX → always use aggregate function, never ORDER BY + LIMIT 1.
  - task: "Минимальный id организации"
    sql: "SELECT MIN(id) AS min_id FROM public.sys_company;"
  - task: "Максимальная дата создания счёта"
    sql: "SELECT MAX(create_date) AS max_date FROM public.acc_number;"
  # Plain list with the LIMIT taken from the task text — no fabricated WHERE.
  - task: "Покажи 25 компаний"
    sql: "SELECT id, name FROM public.sys_company LIMIT 25;"
  # "С/у которых заполнено X" → WHERE X IS NOT NULL (don't invent status = 1).
  - task: "Сотрудники у которых заполнен email"
    sql: "SELECT id, email FROM public.sys_employee WHERE email IS NOT NULL LIMIT 100;"
  # "Последние/новейшие" → ORDER BY ... DESC, no WHERE.
  - task: "Последние созданные счета"
    sql: "SELECT id, create_date FROM public.acc_number ORDER BY create_date DESC LIMIT 20;"
  # "Уникальные/различные" → DISTINCT.
  - task: "Уникальные org_id в счетах"
    sql: "SELECT DISTINCT org_id FROM public.acc_number LIMIT 100;"
  # "По имени X, содержащему Y" — when the task filters by a NAME but the parent
  # table only stores an *_id, JOIN to the referenced table and apply the
  # filter there. Do NOT match Y against name__ru/name on the parent table.
  - task: 'Заявки по имени инициатора, содержащему "ООО"'
    sql: |-
      SELECT ao.id, ao.name, sc.name AS initiator_name, ao.create_date
      FROM public.application_obj ao
      JOIN public.sys_company sc ON ao.initiator_id = sc.id
      WHERE sc.name ILIKE '%ООО%'
      ORDER BY ao.id
      LIMIT 50;
  # Same JOIN pattern on a different child table — generalises beyond
  # application_obj. Demonstrates that the JOIN target (sys_company) is
  # always the name source, regardless of which *_application is the parent.
  - task: 'Корпоративные техзаявки по инициатору с именем, содержащим "Газ"'
    sql: |-
      SELECT cta.id, cta.name, sc.name AS initiator_name, cta.create_date
      FROM public.corp_tech_application cta
      JOIN public.sys_company sc ON cta.initiator_id = sc.id
      WHERE sc.name ILIKE '%Газ%'
      ORDER BY cta.id
      LIMIT 50;
  # Aggregate over a joined dimension — GROUP BY the dimension's name, not its id.
  - task: 'Количество заявок по бизнес-сегменту с именем "Розница"'
    sql: |-
      SELECT bs.name, COUNT(*) AS cnt
      FROM public.application_obj ao
      JOIN public.business_segment bs ON ao.scp_business_segment = bs.id
      WHERE bs.name = 'Розница'
      GROUP BY bs.name;
  # "По признаку X" → GROUP BY the boolean/enum column directly; never filter
  # to one value and never JOIN to a dictionary. Shows all distinct values with counts.
  - task: "Количество заявок по признаку участия в госпрограмме"
    sql: |-
      SELECT is_state_program, COUNT(*) AS cnt
      FROM public.application_obj
      GROUP BY is_state_program
      ORDER BY cnt DESC;
  # "С [specific FK column]" — return the FK column itself with IS NOT NULL.
  # Do NOT join to the lookup table unless the task asks for the name.
  - task: "Заявки SCP с причиной отказа"
    sql: "SELECT id, reason_refusal_id FROM public.scp_application WHERE reason_refusal_id IS NOT NULL LIMIT 20;"
  - task: "Заявки IC с pricing"
    sql: "SELECT id, pricing_id FROM public.ic_application WHERE pricing_id IS NOT NULL LIMIT 20;"
  # mler_client_name is a plain text column — never join, never fabricate.
  - task: "Заявки MLER с именем клиента"
    sql: "SELECT id, mler_client_name FROM public.mler_application WHERE mler_client_name IS NOT NULL LIMIT 20;"
  # date_amd_decision is the decision date column on mler_application.
  - task: "Заявки MLER с датой решения"
    sql: "SELECT id, date_amd_decision FROM public.mler_application WHERE date_amd_decision IS NOT NULL LIMIT 20;"
  # JOIN to sys_company for initiator name applies to any *_application table.
  - task: 'Заявки MLER по инициатору с именем, содержащим "Инвест"'
    sql: |-
      SELECT ma.id, ma.name, sc.name AS initiator_name, ma.create_date
      FROM public.mler_application ma
      JOIN public.sys_company sc ON ma.initiator_id = sc.id
      WHERE sc.name ILIKE '%Инвест%'
      ORDER BY ma.create_date DESC
      LIMIT 50;
vulnerable:
  - task: "Удалить все записи"
    sql: "DELETE FROM public.acc_number;"
  - task: "Все поля сотрудников"
    sql: "SELECT * FROM public.sys_employee;"
