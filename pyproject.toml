[project]
name = "case3"
version = "0.1.0"
description = "SQL generation + security audit MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.17",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
    "sqlglot>=27.0.0",
    "typer>=0.16.0",
    "watchdog>=6.0.0",
    "pymorphy3>=2.0.6",
    "dawg-python>=0.7.2",
]

[project.scripts]
case3 = "case3.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20250516",
]

ui = [
    "streamlit>=1.41.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "I", "W",
  "B",          # flake8-bugbear
  "UP",         # pyupgrade
  "SIM",        # flake8-simplify
  "RUF",        # ruff rules
]
ignore = [
  "E501",       # line length handled by formatter preference; keep lint calm
  "B008",       # Typer uses Option/Argument defaults idiomatically
]

[tool.ruff.lint.per-file-ignores]
"doc/**" = ["RUF001", "RUF003", "RUF012"]
"scripts/**" = ["E402"]
"src/case3/**" = ["RUF001"]
"streamlit_app.py" = ["RUF001"]
"tests/**" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
  "^\\.venv/",
  "^doc/",
  "^streamlit_app\\.py$",
  "^tests/",
]

[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymorphy3.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
